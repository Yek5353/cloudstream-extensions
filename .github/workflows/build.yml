name: Build and publish CloudStream plugins
on:
  push:
    branches: [main, master]
    paths-ignore: ["*.md"]
permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          path: src
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build plugins and plugin list
        working-directory: src
        run: gradle make makePluginsJson
      - name: Save build output
        uses: actions/upload-artifact@v4
        with:
          name: cloudstream-plugins
          if-no-files-found: error
          path: |
            src/*/build/*.cs3
            src/build/plugins.json

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out builds branch
        uses: actions/checkout@v7
        with:
          ref: builds
          path: builds
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: cloudstream-plugins
          path: publish
      - name: Update published plugin files
        run: |
          rm -f builds/*.cs3 builds/plugins.json
          find publish -type f -name "*.cs3" -exec cp {} builds/ \;
          cp publish/build/plugins.json builds/plugins.json
      - name: Commit and publish builds branch
        working-directory: builds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated plugin changes."
            exit 0
          fi
          git commit -m "Build ${GITHUB_SHA:0:7}"
          git push origin HEAD:builds
