name: Validate CloudStream repository

on:
  pull_request:
    branches: [main, master]
    paths-ignore: ["docs/**", "*.md"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Validate provider registry and domains
        run: python tools/validate_repo.py
